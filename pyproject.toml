[project]
name = "news"
version = "0.1.0"
description = "news-aggregator"
readme = "README.md"
authors = [
    { name = "Alexander Smirnov", email = "alsmirnnov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=24",
    "apscheduler>=3.11,<4",
    "beautifulsoup4>=4.12",
    "fastapi>=0.139.0",
    "httpx>=0.28",
    "openai>=2",
    "pydantic-settings>=2",
    "tenacity>=9",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "datasets>=4.5.0",
    "deepeval>=4.1",
    "pyright>=1.1.407",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "rouge-score>=0.1.2",
    "ruff>=0.14.8",
    "types-aiofiles>=24.1.0",
]

[tool.uv]
# Sync all defined dependency groups by default
default-groups = ["dev"]
package = true

[tool.uv.sources]

[project.scripts]
news = "news:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
asyncio_default_fixture_loop_scope = "module"
log_cli = true
log_cli_level = "INFO" 
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning", 
    "ignore::UserWarning"
]
markers = [
    "integration: real network I/O — excluded from the unit-test run",
]

[tool.ruff]
line-length = 79
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Verbatim LLM prompt text ported from the notebook; wrapping it to fit
# the line-length limit would corrupt exact content/whitespace parity.
"src/news/digest/prompts.py" = ["E501"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"] # Directories to analyze
exclude = ["**/node_modules", "**/__pycache__",".*", ".venv"]
extraPaths = ["src"]       # Directories to search for imports
venvPath = "."
venv = ".venv"
