<div id="group-{{ g.index }}" class="ge-block"{% if oob %} hx-swap-oob="{{ oob }}"{% endif %}>
  <div class="ge-row ge-group" data-row="g:{{ g.index }}" data-group="{{ g.index }}" data-key="{{ g.key }}">
    <span class="ge-caret">▸</span>
    <kbd>{{ g.key }}</kbd>
    <span class="ge-title{{ ' ge-placeholder' if g.placeholder }}">{{ g.title }}</span>
    <span class="ge-count">({{ g.members | length }})</span>
  </div>
  <div class="ge-children">
    {% for m in g.members %}
    <div class="ge-row ge-member{{ ' missing' if m.missing }}" data-row="g:{{ g.index }}:{{ m.link }}" data-group="{{ g.index }}" data-link="{{ m.link }}" draggable="true">{{ m.title }}</div>
    {% endfor %}
  </div>
</div>
